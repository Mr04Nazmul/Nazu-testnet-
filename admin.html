<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAZU Admin</title>
<style>body{margin:0;background:#080b10;color:#eef2f7;font-family:system-ui;padding:28px}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222b37;padding-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.card{background:#10151d;border:1px solid #26303d;border-radius:15px;padding:18px}.num{font-size:28px;font-weight:800;margin-top:8px}table{width:100%;border-collapse:collapse;background:#10151d;border:1px solid #26303d}th,td{padding:14px;text-align:left;border-bottom:1px solid #202936}th{color:#8f9aaa;font-size:12px;text-transform:uppercase}p{color:#8f9aaa}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}table{font-size:12px}}</style></head>
<body><div class="wrap"><div class="top"><h1>NAZU Admin</h1><span>Private control panel</span></div><p>This is the admin UI shell. Connect it to Supabase with server-side authentication before production use.</p>
<div class="grid"><div class="card">Users<div class="num" id="users">0</div></div><div class="card">Active nodes<div class="num" id="nodes">0</div></div><div class="card">Total points<div class="num" id="points">0</div></div><div class="card">Airdrop pool<div class="num">Not set</div></div></div>
<table><thead><tr><th>Wallet</th><th>Points</th><th>Node</th><th>Eligibility</th></tr></thead><tbody id="rows"><tr><td colspan="4">No production data connected yet.</td></tr></tbody></table></div></body></html>
